# Intégration continue : typage, tests unitaires, tests de règles Firestore (émulateur), tests Chrome réel.
# Gratuit : dépôt public ⇒ minutes GitHub Actions illimitées. Aucun secret requis.
name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci --legacy-peer-deps
      - name: Typage
        run: npm run typecheck
      - name: Audit zéro dépense (test L)
        run: npm run audit:zero
      - name: Tests unitaires
        run: npm test
      - name: Règles Firestore (émulateur local, aucun appel vers Google)
        run: npm run test:rules
      - name: Comptes séparés dans Chrome réel (émulateurs Auth + Firestore locaux, test A)
        run: npm run test:e2e:accounts
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - name: Build de production
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - name: Tests Chrome réel (Java exécuté dans le navigateur)
        run: npx playwright test
        env:
          CI: 'true'
          CHROME_PATH: /usr/bin/google-chrome
      - name: Rapports en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 7
